<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wc-flight-reader — demo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 24px;
        background: #f8fafc;
        color: #1e293b;
      }
      h1 { font-size: 1.25rem; margin-bottom: 4px; }
      .subtitle { font-size: 0.875rem; color: #64748b; margin: 0 0 28px; }
      label { font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
      select, input[type="text"] {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.875rem;
        margin-bottom: 16px;
        background: #fff;
      }
      .key-row { position: relative; }
      .key-row input { padding-right: 70px; }
      .key-tag {
        position: absolute; right: 8px; top: 7px;
        font-size: 0.7rem; background: #f1f5f9; color: #64748b;
        padding: 2px 6px; border-radius: 4px;
      }
      flight-reader { margin: 4px 0 24px; display: block; }
      pre {
        background: #1e293b;
        color: #e2e8f0;
        padding: 16px;
        border-radius: 8px;
        font-size: 0.8rem;
        overflow-x: auto;
        white-space: pre-wrap;
        min-height: 60px;
      }
      .section { margin-bottom: 20px; }
      .badge {
        display: inline-block; font-size: 0.65rem; font-weight: 700;
        padding: 2px 6px; border-radius: 4px; vertical-align: middle;
        margin-left: 6px;
      }
      .badge-env { background: #dcfce7; color: #166534; }
      .badge-manual { background: #fef9c3; color: #713f12; }
    </style>
  </head>
  <body>
    <h1>flight-reader</h1>
    <p class="subtitle">Production demo — serving <code>dist/wc-flight-reader.js</code></p>

    <div class="section">
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="subscription">Codex subscription</option>
      </select>
    </div>

    <div class="section key-row">
      <label for="apikey"><span id="key-label">API Key</span> <span id="key-badge" class="badge badge-env">.env</span></label>
      <input type="text" id="apikey" placeholder="Overriding key…" autocomplete="off" />
    </div>

    <div class="section" id="subscription-config" hidden>
      <label for="subscription-url">subscription-llm URL</label>
      <input type="text" id="subscription-url" placeholder="http://127.0.0.1:8789/v1/chat/completions" autocomplete="off" />
    </div>

    <flight-reader id="reader" provider="gemini"></flight-reader>

    <label>Extracted data</label>
    <pre id="output">Drop, click or paste a flight screenshot above.</pre>

    <script type="module">
      import "/dist/wc-flight-reader.js"

      const reader = document.getElementById("reader")
      const output = document.getElementById("output")
      const providerSelect = document.getElementById("provider")
      const apikeyInput = document.getElementById("apikey")
      const keyBadge = document.getElementById("key-badge")

      const keyLabel = document.getElementById("key-label")
      const subscriptionConfig = document.getElementById("subscription-config")
      const subscriptionUrlInput = document.getElementById("subscription-url")
      const geminiKey = window.__DEMO_KEY__ || ""
      const openaiKey = window.__DEMO_OPENAI_KEY__ || ""
      const subscriptionUrl = window.__DEMO_SUBSCRIPTION_LLM_URL__ || ""
      const subscriptionToken = window.__DEMO_SUBSCRIPTION_LLM_TOKEN__ || ""

      reader.geminiModel = window.__DEMO_GEMINI_MODEL__ || "gemini-3.1-flash-lite"
      reader.openaiModel = window.__DEMO_OPENAI_MODEL__ || "gpt-5-nano"
      subscriptionUrlInput.value = subscriptionUrl

      function applyProvider() {
        const provider = providerSelect.value
        const isSubscription = provider === "subscription"
        const envKey = isSubscription ? subscriptionToken : provider === "openai" ? openaiKey : geminiKey
        reader.provider = provider
        reader.subscriptionUrl = isSubscription ? subscriptionUrlInput.value.trim() : ""
        reader.apiKey = apikeyInput.value.trim() || envKey
        subscriptionConfig.hidden = !isSubscription
        keyLabel.textContent = isSubscription ? "Service token" : "API Key"
        keyBadge.textContent = apikeyInput.value.trim() ? "manual" : envKey ? ".env" : "manual"
        keyBadge.className = "badge " + (apikeyInput.value.trim() || !envKey ? "badge-manual" : "badge-env")
        apikeyInput.placeholder = isSubscription ? "Optional Bearer token…" : "Paste your API key…"
      }

      providerSelect.addEventListener("change", applyProvider)
      subscriptionUrlInput.addEventListener("input", applyProvider)
      apikeyInput.addEventListener("input", applyProvider)
      applyProvider()

      reader.addEventListener("flight-data", (e) => {
        output.textContent = JSON.stringify(e.detail, null, 2)
      })
    </script>
  </body>
</html>
